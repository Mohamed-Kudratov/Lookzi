name: build pod image

# Builds the RunPod image and pushes it to Docker Hub.
#
# GitHub builds it, so nothing large crosses a home connection and no local
# Docker is needed. Runs on every push that touches the image or the code baked
# into it, and can be started by hand from the Actions tab.
#
# Two repository secrets are required:
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token (not the password)

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - 'pipeline.py'
      - 'utils.py'
      - 'app.py'
      - 'elements/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A hosted runner starts with ~14 GB free, and this image is larger than
      # that. Removing the preinstalled toolchains nobody here uses buys ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lookzi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lookzi:${{ github.sha }}
          # The Dockerfile clones the repo itself, so the commit being built has
          # to be passed in -- otherwise a rebuild would silently ship whatever
          # main pointed at when the layer was first cached.
          build-args: |
            REPO_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '`${{ secrets.DOCKERHUB_USERNAME }}/lookzi:latest`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use it as the RunPod container image. Container disk 40 GB, volume 120 GB at /workspace, expose HTTP port 7860." >> $GITHUB_STEP_SUMMARY
