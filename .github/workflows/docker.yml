name: build pod image

# Builds the RunPod image and pushes it to Docker Hub.
#
# GitHub builds it, so nothing large crosses a home connection and no local
# Docker is needed. Runs on every push that touches the image or the code baked
# into it, and can be started by hand from the Actions tab.
#
# Two repository secrets are required:
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token (not the password)

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - 'pipeline.py'
      - 'utils.py'
      - 'app.py'
      - 'elements/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A hosted runner starts with ~14 GB free, and this image is larger than
      # that. Removing the preinstalled toolchains nobody here uses buys ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean
          df -h / | tail -1

      # `malformed HTTP Authorization header` from registry-1.docker.io means
      # the credentials contain something they should not -- almost always a
      # trailing newline or space picked up when pasting, or the whole
      # `docker login -u name` line stored instead of just the name. This
      # reports the shape without ever printing the values.
      - name: Check secrets
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          fail=0
          if [ -z "$U" ]; then echo "::error::DOCKERHUB_USERNAME is empty or missing"; fail=1; fi
          if [ -z "$T" ]; then echo "::error::DOCKERHUB_TOKEN is empty or missing"; fail=1; fi
          echo "username: ${#U} chars, token: ${#T} chars"
          # Say which kind of wrong it is -- the value itself can never be shown,
          # so a generic "invalid character" leaves nothing to act on.
          case "$U" in
            *@*)  echo "::error::DOCKERHUB_USERNAME looks like an email address. Docker Hub accepts an email to sign in, but the registry needs the USERNAME -- the short name shown at the top right of hub.docker.com."; fail=1 ;;
            *[[:space:]]*) echo "::error::DOCKERHUB_USERNAME contains a space or newline, almost certainly picked up while pasting. Re-add it with the cursor ending immediately after the last character."; fail=1 ;;
            *[![:alnum:]_-]*) echo "::error::DOCKERHUB_USERNAME contains a character outside letters, digits, - and _. Check for quotes, or for the whole 'docker login -u name' line being stored instead of just the name."; fail=1 ;;
          esac
          case "$U" in
            *[[:upper:]]*) echo "::warning::DOCKERHUB_USERNAME has uppercase letters; Docker Hub usernames are lowercase." ;;
          esac
          case "$T" in
            *[[:space:]]*) echo "::error::DOCKERHUB_TOKEN contains whitespace -- most likely a trailing newline from copy/paste. Re-add it."; fail=1 ;;
          esac
          [ "$fail" = "0" ] || exit 1
          echo "secrets look well-formed"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lookzi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lookzi:${{ github.sha }}
          # The Dockerfile clones the repo itself, so the commit being built has
          # to be passed in -- otherwise a rebuild would silently ship whatever
          # main pointed at when the layer was first cached.
          build-args: |
            REPO_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '`${{ secrets.DOCKERHUB_USERNAME }}/lookzi:latest`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use it as the RunPod container image. Container disk 40 GB, volume 120 GB at /workspace, expose HTTP port 7860." >> $GITHUB_STEP_SUMMARY
