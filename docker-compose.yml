# The whole product on one machine, with no GPU.
#
#   docker compose up --build
#   open http://localhost:8000/docs
#
# Four containers stand in for four production services: Postgres for the
# managed database, MinIO for Cloudflare R2, the web tier as itself, and a
# stub worker where the GPU pool will be. Nothing here imports torch, so the
# stack builds in under a minute and runs on a laptop.
#
# Production changes the addresses, not the code.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lookzi
      POSTGRES_PASSWORD: lookzi
      POSTGRES_DB: lookzi
    # 5433 on the host, not 5432. A developer machine often already runs
    # Postgres, and when it does the container silently loses the race for the
    # IPv4 address -- connections land on the local server instead, which
    # answers and then rejects the password. The symptom looks like a wrong
    # password rather than a wrong server, and costs an hour.
    ports: ["5433:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      # Postgres runs everything in this directory on first start, so the
      # schema is applied before anything can connect to an empty database.
      - ./service/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookzi -d lookzi"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lookzi
      MINIO_ROOT_PASSWORD: lookzi-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    command: uvicorn service.app:app --host 0.0.0.0 --port 8000 --reload
    environment: &svc-env
      DATABASE_URL: postgresql://lookzi:lookzi@db:5432/lookzi
      S3_ENDPOINT: http://storage:9000
      S3_KEY: lookzi
      S3_SECRET: lookzi-dev-secret
      S3_BUCKET: lookzi
      # What the container talks to, and what it tells the outside world.
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      # Pictures and uploads go through the app rather than straight at the
      # bucket, so a link works from anywhere and not only from this machine.
      S3_PROXY: "${S3_PROXY:-1}"
      # Without a key the gallery is open to whoever has the link.
      REVIEW_KEY: "${REVIEW_KEY:-}"
      PYTHONUNBUFFERED: "1"
    # 8080 on the host. As with the database, a developer machine often has
    # something on the obvious port already, and Docker then wins only the
    # IPv6 address -- so 127.0.0.1 reaches the other program and the symptom
    # is a 404 from a server that looks like ours.
    ports: ["8080:8000"]
    volumes:
      # Mounted rather than copied so an edit is live without a rebuild.
      - ./service:/app/service
      - ./elements:/app/elements
      # Stand-in photographs for local development, so a model can be chosen
      # before the roster's own images come off the pod.
      - ./assets:/app/assets:ro
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_healthy }

  # The public link, and it runs here rather than on the host for two reasons:
  # the agent Windows has installed is too old for the service and refuses to
  # authenticate, and a fresh download is quarantined by Defender the moment it
  # lands -- ngrok is a tunnel, so every scanner treats it as one. In a
  # container neither is a problem, nothing is installed on the machine, and it
  # reaches the app over the compose network instead of through the host.
  #
  #     docker compose --profile public up -d ngrok
  #     docker compose logs ngrok | grep url=
  #
  # Off unless asked for: a link that opens itself every time the stack starts
  # is a link nobody remembers is open.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["public"]
    command: ["http", "web:8000", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}"
    ports: ["4040:4040"]
    depends_on: [web]

  worker:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    command: python -m service.fake_worker
    environment:
      <<: *svc-env
      # A stub is for exercising the interface, not for waiting out a real
      # generation. Set it to 14.3 to feel the true latency.
      FAKE_SECONDS: "2"
      WORKER_NAME: fake-1
      # A worker with no filter claims every job in the table, including ones
      # meant for another pool -- a video worker would swallow try-on work and
      # reload its model between each. Declaring the list is how pools stay
      # apart, and it is also what keeps a running worker from eating the
      # integration test's jobs.
      WORKER_TOOLS: product-to-model,virtual-try-on,model-swap,packshot
    volumes:
      - ./service:/app/service
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_healthy }

  # Behind a profile, so the rest of the stack comes up without a bot token.
  #
  #   docker compose up                    database, storage, web, worker
  #   docker compose --profile bot up      ... and the bot
  #
  # It was a required variable, which meant a missing token stopped Postgres
  # from starting. A component nobody has configured yet should be absent, not
  # fatal to everything around it.
  bot:
    profiles: ["bot"]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    command: python -m service.bot
    environment:
      <<: *svc-env
      # Read from .env, never written into this file. The bot itself refuses
      # to start when it is empty, and says so.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./service:/app/service
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_healthy }

volumes:
  db-data:
  minio-data:
