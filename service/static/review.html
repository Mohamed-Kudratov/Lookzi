<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookzi · every garment tried</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A; --card:#1B2336; --line:#232B3E; --line-2:#334155;
  --ink:#F8FAFC; --ink-2:#94A3B8; --ink-3:#64748B;
  --ok:#22C55E; --bad:#EF4444; --wait:#38BDF8;
  --sans:"Fira Sans",system-ui,sans-serif; --mono:"Fira Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:20px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
header p{margin:0;color:var(--ink-3);font-size:12.5px}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-2)}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.filters button{cursor:pointer;font:inherit;font-size:12.5px;padding:6px 12px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--card);
  color:var(--ink-2);transition:background .15s ease,color .15s ease}
.filters button:hover{background:#252E44;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);
  border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--wait);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  overflow:hidden}

/* One picture at a time, whatever the job actually had. A job with three
   pictures cycles through all three; one with a single result never moves. */
.frame{position:relative;aspect-ratio:3/4;background:#0B1120;display:block;
  width:100%;padding:0;border:0;cursor:zoom-in;overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transition:opacity .4s ease}
.frame img.on{opacity:1}
.frame .tag{position:absolute;top:6px;left:6px;z-index:2;font-family:var(--mono);
  font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(2,6,23,.72);
  color:var(--ink-2)}
.frame .dots{position:absolute;bottom:7px;left:0;right:0;z-index:2;display:flex;
  gap:5px;justify-content:center}
.frame .dots i{width:5px;height:5px;border-radius:50%;background:rgba(248,250,252,.32)}
.frame .dots i.on{background:var(--ink)}
.frame .none{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--ink-3);font-size:11.5px}

/* the way back. The gallery had none: you arrived from the studio and the
   only exit was the browser's own back button. */
.nav{display:flex;gap:8px;align-items:center}
.nav a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--card);color:var(--ink-2)}
.nav a:hover{background:#252E44;color:var(--ink)}
.nav svg{width:14px;height:14px}

.meta{padding:9px 11px;display:grid;gap:4px}
.meta .top{display:flex;align-items:baseline;gap:8px}
.kill{margin-left:auto;cursor:pointer;font:inherit;font-size:11px;line-height:1;
  padding:3px 7px;border-radius:6px;border:1px solid var(--line-2);
  background:transparent;color:var(--ink-3)}
.kill:hover{color:var(--bad);border-color:#5C2020}
.kill[data-armed="1"]{color:var(--bad);border-color:#5C2020}
.meta .row{display:flex;align-items:baseline;gap:8px}
.meta b{font-size:12.5px;font-weight:500}
.meta .who{color:var(--wait);font-size:11.5px;font-family:var(--mono)}
.meta .when{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.state{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;
  border:1px solid var(--line-2);color:var(--ink-2)}
.state[data-s="done"]{color:var(--ok);border-color:#1B5233}
.state[data-s="failed"]{color:var(--bad);border-color:#5C2020}
.state[data-s="queued"],.state[data-s="running"]{color:var(--wait);border-color:#1E4C63}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* the big view: same page, opens and closes, never a second tab */
/* Sized to the picture and centred by the browser. Given 100vw/100vh it grew
   the page instead of covering it, and everything anchored to the viewport
   landed off-screen. */
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(2,6,23,.9)}
.view{position:relative;display:grid;place-items:center}
.view img{max-width:88vw;max-height:84vh;display:block;border-radius:8px}
.view .cap{position:fixed;bottom:20px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.view .cap b{color:var(--ink);font-weight:500}
.view button{position:fixed;cursor:pointer;font:inherit;color:var(--ink);
  border:1px solid var(--line-2);background:rgba(27,35,54,.9);border-radius:10px}
.view .x{top:16px;right:18px;padding:7px 14px}
.view .go{top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:20px;
  display:grid;place-items:center}
.view .go[disabled]{opacity:.25;cursor:default}
.view .prev{left:18px} .view .next{right:18px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Every garment tried</h1>
    <p>What went in, what came out.</p>
    <span class="count" id="count"></span>
    <nav class="nav">
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path
        d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>Studio</a>
    </nav>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><p class="empty">Loading…</p></div>
</div>

<dialog id="viewer">
  <div class="view">
    <button class="x" id="close">Close</button>
    <button class="go prev" id="prev" aria-label="Previous">‹</button>
    <img id="big" alt="">
    <button class="go next" id="next" aria-label="Next">›</button>
    <div class="cap" id="cap"></div>
  </div>
</dialog>

<script>
var ALL = [], filter = "all";
var qs = new URLSearchParams(location.search);
var KEY = qs.get("key") ? "?key=" + encodeURIComponent(qs.get("key")) + "&" : "?";

function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function when(iso){
  if (!iso) return "";
  var d = new Date(iso), mins = Math.round((new Date() - d) / 60000);
  if (mins < 60) return mins + "m ago";
  if (mins < 60 * 24) return Math.round(mins / 60) + "h ago";
  return d.toISOString().slice(5, 16).replace("T", " ");
}

// What a job is made of, in the order it happened: the person, the product,
// the model who wore it, then what came out. Only what the job actually had --
// "make a new model" starts from nothing but words, so it is one picture, and
// showing it an empty box labelled "input" was saying something untrue.
function framesOf(r){
  var f = [];
  if (r.person)  f.push({url: r.person,  label: "your photo"});
  if (r.garment) f.push({url: r.garment, label: "product"});
  if (r.model)   f.push({url: r.model,   label: r.model_id || "model"});
  if (r.result)  f.push({url: r.result,  label: "result"});
  return f;
}

function draw(){
  var rows = ALL.filter(function (r) { return filter === "all" || r.tool === filter; });
  document.getElementById("count").textContent =
    rows.length + " of " + ALL.length + " job" + (ALL.length === 1 ? "" : "s");
  document.getElementById("grid").innerHTML = rows.length ? rows.map(function (r, i) {
    var f = framesOf(r);
    // Staggered, so a screenful of cards does not flip in unison like a
    // departure board. Each starts its cycle at a different point.
    var start = f.length ? i % f.length : 0;
    return '<article class="card">' +
      '<button class="frame" data-job="' + esc(r.job_id) + '" data-i="' + start + '">' +
        (f.length
          ? '<span class="tag">' + esc(f[start].label) + '</span>' +
            f.map(function (x, k) {
              return '<img src="' + esc(x.url) + '" alt="' + esc(x.label) + '"' +
                (k === start ? ' class="on"' : '') + ' loading="lazy">';
            }).join("") +
            (f.length > 1 ? '<span class="dots">' + f.map(function (_, k) {
              return '<i' + (k === start ? ' class="on"' : '') + '></i>';
            }).join("") + '</span>' : "")
          : '<span class="none">nothing kept</span>') +
      '</button>' +
      '<div class="meta">' +
        '<div class="top"><b>' + esc(r.tool) + '</b>' +
          '<span class="state" data-s="' + esc(r.status) + '">' + esc(r.status) + '</span>' +
          '<button class="kill" data-kill="' + esc(r.job_id) + '">delete</button></div>' +
        '<div class="row">' +
          '<span class="when" style="margin-left:0">' + when(r.created_at) + '</span>' +
          (r.model_id ? '<span class="who">' + esc(r.model_id) + '</span>' : "") +
          (r.seconds ? '<span class="when">' + r.seconds + 's</span>' : "") +
        '</div>' +
      '</div></article>';
  }).join("") : '<p class="empty">Nothing matches that.</p>';
}

// ------------------------------------------------------------ the cycling
function show(frame, i){
  var imgs = frame.querySelectorAll("img");
  if (imgs.length < 2) return;
  i = ((i % imgs.length) + imgs.length) % imgs.length;
  frame.dataset.i = i;
  for (var k = 0; k < imgs.length; k++) imgs[k].classList.toggle("on", k === i);
  var dots = frame.querySelectorAll(".dots i");
  for (var d = 0; d < dots.length; d++) dots[d].classList.toggle("on", d === i);
  var tag = frame.querySelector(".tag");
  if (tag) tag.textContent = imgs[i].alt;
}

setInterval(function () {
  if (document.getElementById("viewer").open) return;    // not while one is open
  var frames = document.querySelectorAll(".frame");
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].matches(":hover")) continue;           // hold still to be read
    show(frames[i], Number(frames[i].dataset.i || 0) + 1);
  }
}, 2400);

// ------------------------------------------------------------ the big view
var view = {frames: [], at: 0};

function paint(){
  var f = view.frames[view.at];
  if (!f) return;
  document.getElementById("big").src = f.url;
  document.getElementById("cap").innerHTML =
    '<b>' + esc(f.label) + '</b> · ' + (view.at + 1) + " of " + view.frames.length;
  document.getElementById("prev").disabled = view.frames.length < 2;
  document.getElementById("next").disabled = view.frames.length < 2;
}
function step(d){
  if (view.frames.length < 2) return;
  view.at = (view.at + d + view.frames.length) % view.frames.length;
  paint();
}

document.getElementById("grid").addEventListener("click", function (e) {
  var kill = e.target.closest("[data-kill]");
  if (kill) {
    // Two clicks, no dialog. A confirm box for a single test result is an
    // interruption; a button that says "sure?" and goes back to "delete" if
    // you look away is enough of a pause to catch a misclick.
    if (kill.dataset.armed !== "1") {
      kill.dataset.armed = "1"; kill.textContent = "sure?";
      setTimeout(function () {
        if (kill.isConnected) { kill.dataset.armed = "0"; kill.textContent = "delete"; }
      }, 3000);
      return;
    }
    var id = kill.dataset.kill;
    kill.textContent = "…";
    fetch("/api/review/" + id + (KEY === "?" ? "" : KEY.slice(0, -1)),
          {method: "DELETE"})
      .then(function (r) { if (!r.ok) throw new Error("could not delete (" + r.status + ")"); })
      .then(function () {
        ALL = ALL.filter(function (x) { return x.job_id !== id; });
        drawFilters(); draw();
      })
      .catch(function (err) { kill.textContent = "failed"; console.error(err); });
    return;
  }

  var frame = e.target.closest(".frame"); if (!frame) return;
  var row = ALL.filter(function (r) { return r.job_id === frame.dataset.job; })[0];
  if (!row) return;
  view.frames = framesOf(row);
  if (!view.frames.length) return;
  view.at = Number(frame.dataset.i || 0) % view.frames.length;
  paint();
  document.getElementById("viewer").showModal();
});
document.getElementById("prev").addEventListener("click", function () { step(-1); });
document.getElementById("next").addEventListener("click", function () { step(1); });
document.getElementById("close").addEventListener("click", function () {
  document.getElementById("viewer").close();
});
document.addEventListener("keydown", function (e) {
  if (!document.getElementById("viewer").open) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});
// Clicking the darkness closes it, which is what everybody tries first.
document.getElementById("viewer").addEventListener("click", function (e) {
  if (e.target.closest("img,button")) return;
  this.close();
});

// ------------------------------------------------------------ the filters
function drawFilters(){
  var tools = ["all"].concat(ALL.map(function (r) { return r.tool; })
    .filter(function (t, i, a) { return t && a.indexOf(t) === i; }).sort());
  document.getElementById("filters").innerHTML = tools.map(function (t) {
    return '<button data-t="' + esc(t) + '" aria-pressed="' + (t === filter) + '">' +
      esc(t) + '</button>';
  }).join("");
}
document.getElementById("filters").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.t; drawFilters(); draw();
});

fetch("/api/review" + KEY + "limit=200")
  .then(function (r) { if (!r.ok) throw new Error("not available (" + r.status + ")"); return r.json(); })
  .then(function (rows) { ALL = rows; drawFilters(); draw(); })
  .catch(function (e) {
    document.getElementById("grid").innerHTML =
      '<p class="empty">' + esc(e.message) + '</p>';
  });
</script>
</body>
</html>
