<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookzi Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Dark first. Every tool a photographer already uses is dark, because a bright
   interface changes how you judge the picture sitting next to it -- and the
   picture is the only thing on this screen that should carry colour. Light is
   supported for anyone who wants it. */
:root{
  --bg:#0B0C0E; --panel:#131519; --panel-2:#1A1D22; --raised:#22262D;
  --line:#23272E; --line-2:#333943;
  --ink:#F1F0EC; --ink-2:#A2A8B0; --ink-3:#6C737C;
  --brand:#7B8AF0; --brand-soft:#1D2340; --on-brand:#0B0C0E;
  --wait:#D9B65E; --wait-soft:#2A2415;
  --run:#5BB8C9;  --run-soft:#132A2F;
  --done:#63BE87; --done-soft:#14271C;
  --bad:#D4785D;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 44px -24px rgba(0,0,0,.9);
  --ease:cubic-bezier(.2,.7,.3,1);
  --rail:216px; --panel-w:320px;
}
:root[data-theme="light"]{
  --bg:#F5F5F2; --panel:#FFFFFF; --panel-2:#EFEEE9; --raised:#E6E5DF;
  --line:#E2E0D9; --line-2:#CDCAC1;
  --ink:#14161A; --ink-2:#575D65; --ink-3:#878D95;
  --brand:#3B4BA0; --brand-soft:#E6E9F8; --on-brand:#FFFFFF;
  --wait:#8A6A1C; --wait-soft:#F6EED6;
  --run:#1F6B7A;  --run-soft:#DCEDF1;
  --done:#2F6B45; --done-soft:#DDEEE3;
  --bad:#A9472F;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 16px 38px -24px rgba(20,22,26,.4);
}
*{box-sizing:border-box}
/* The hidden attribute is only display:none at the browser's own specificity,
   so any rule that sets display -- .slot .empty{display:grid} did -- wins and
   the element stays on screen. That put "Nothing yet" above every finished
   image. Worth enforcing once here rather than per element, because the same
   trap is waiting behind every display rule on the page. */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:400 15px/1.5 "Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font:500 10px/1.4 "Martian Mono",ui-monospace,monospace;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:56px 1fr;height:100dvh}
.bar{display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-family:Archivo;font-variation-settings:"wdth" 122,"wght" 800;
  font-size:20px;letter-spacing:-.05em}
.bar .spacer{margin-inline-start:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line-2);font:500 11px/1 "Martian Mono",monospace;color:var(--ink-2)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip[data-s="running"]{color:var(--run);border-color:color-mix(in srgb,var(--run) 40%,transparent)}
.chip[data-s="queued"]{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 40%,transparent)}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;
  display:grid;place-items:center;background:var(--panel-2);transition:150ms var(--ease)}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

.body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--panel-w);min-height:0}

/* ---------- rail ---------- */
.rail{border-inline-end:1px solid var(--line);background:var(--panel);
  padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.rail .mono{padding:6px 8px 8px}
.tool{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;
  border-radius:9px;text-align:start;color:var(--ink-2);transition:150ms var(--ease);
  min-height:44px}
.tool:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);
  box-shadow:inset 2px 0 0 var(--brand)}
.tool:disabled{opacity:.42;cursor:not-allowed}
.tool svg{width:19px;height:19px;flex:none}
.tool b{font-size:13.5px;font-weight:500}
.tool small{margin-inline-start:auto;font:500 8.5px/1 "Martian Mono",monospace;
  letter-spacing:.1em;color:var(--wait)}

/* ---------- canvas ---------- */
.canvas{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.canvas-head{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.canvas-head h1{font-family:Archivo;font-variation-settings:"wdth" 112,"wght" 700;
  font-size:17px;letter-spacing:-.02em;margin:0}
.canvas-head p{margin:0;color:var(--ink-3);font-size:13px}
/* One thing now: the result. The inputs moved to the panel, where the tool
   says what they are. */
/* The row is explicit. Without it the single slot takes an implicit auto
   row, sizes itself to the image's own pixels, and a 768x1024 result spills
   far past the viewport -- which looked like the model returning half a
   body when it was returning a whole one nobody could see. */
.slots{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
  gap:14px;padding:18px;min-height:0;overflow:hidden}
.slot{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--panel);display:grid;place-items:center;min-height:0}
.slot.drop{border-style:dashed;cursor:pointer}
.slot.drop:hover,.slot.over{border-color:var(--brand);background:var(--brand-soft)}
/* Positioned rather than sized. A percentage height on a centred grid item
   does not resolve against the slot here, so a 512x896 result rendered at its
   own pixel size and ran off the bottom of the page -- which read as the model
   returning half a body when it had returned a whole one. inset:0 on the
   relative slot is exact whatever the layout does around it. */
.slot img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:var(--panel-2)}
.slot .tag{position:absolute;top:10px;inset-inline-start:10px;z-index:2;
  padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  border:1px solid var(--line)}
.slot .empty{text-align:center;padding:24px;color:var(--ink-3);display:grid;gap:8px;justify-items:center}
.slot .empty svg{width:26px;height:26px;color:var(--ink-3)}
.slot .empty b{color:var(--ink-2);font-weight:500;font-size:13.5px}
.slot .empty span{font-size:12px}
.slot input[type=file]{display:none}
.slot .swap{position:absolute;bottom:10px;inset-inline-end:10px;z-index:2;
  padding:7px 11px;border-radius:8px;font-size:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  border:1px solid var(--line-2);color:var(--ink-2)}
.slot .swap:hover{color:var(--ink);border-color:var(--brand)}

.veil{position:absolute;inset:0;z-index:3;display:grid;place-items:center;gap:14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);text-align:center;padding:24px}
.veil[hidden]{display:none}
.veil .num{font:500 30px/1 "Martian Mono",monospace;font-variant-numeric:tabular-nums}
.bar-track{width:190px;height:4px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar-track i{display:block;height:100%;width:0;background:var(--run);
  transition:width 400ms var(--ease)}

/* ---------- history ---------- */
.strip{border-top:1px solid var(--line);background:var(--panel);padding:10px 18px;
  display:flex;align-items:center;gap:10px;min-height:92px}
.strip .mono{flex:none}
.strip-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.strip a{flex:none;width:56px;height:72px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel-2);transition:150ms var(--ease)}
.strip a:hover{border-color:var(--brand);translate:0 -2px}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .none{color:var(--ink-3);font-size:12.5px}

/* ---------- right panel ---------- */
.panel{border-inline-start:1px solid var(--line);background:var(--panel);
  display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.panel-scroll{overflow-y:auto;padding:16px;display:grid;gap:18px;align-content:start}
/* ---------- the input steps ---------- */
/* Numbered, because a customer arriving at a tool should be able to see how
   many things it wants before starting, not discover the second one after
   finishing the first. */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.step{display:grid;grid-template-columns:22px 1fr;gap:9px 10px;align-items:start}
.step-n{grid-row:1;width:22px;height:22px;border-radius:50%;display:grid;
  place-items:center;font:500 11px/1 var(--mono);color:var(--ink-3);
  border:1px solid var(--line);background:var(--panel-2)}
.step[data-done="true"] .step-n{border-color:var(--brand);color:var(--brand)}
.step-h{grid-row:1;display:grid;gap:1px}
.step-h b{font-size:13px;font-weight:500}
.step-h > span{font-size:11.5px;color:var(--ink-3)}
.step .chosen{grid-column:2;font-size:12px;color:var(--brand);margin-top:-4px}
.step .drop,.step .models,.step .look,.step textarea,.step .examples{grid-column:2}
.step textarea{width:100%;resize:vertical;min-height:84px;padding:10px 11px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink);font:inherit;font-size:13px;line-height:1.5}
.step textarea:focus{outline:2px solid var(--brand);outline-offset:1px;
  border-color:transparent}
.step textarea::placeholder{color:var(--ink-3)}
.examples{display:grid;gap:5px;margin-top:7px}
.examples button{cursor:pointer;font:inherit;font-size:11.5px;text-align:start;
  padding:6px 9px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--ink-3)}
.examples button:hover{background:var(--panel-2);color:var(--ink-2)}
.look{display:grid;gap:9px}
.look-row{display:grid;gap:5px}
.look-row > span{font-size:11.5px;color:var(--ink-3)}
.look .seg{display:flex;flex-wrap:wrap;gap:5px}
.look .seg button{cursor:pointer;font:inherit;font-size:12px;padding:6px 11px;
  border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-2);transition:background .15s ease,color .15s ease}
.look .seg button:hover{background:#252E44;color:var(--ink)}
.look .seg button[aria-pressed="true"]{background:var(--brand);color:#0B1120;
  border-color:var(--brand)}
.look .seg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.step .nothing{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--ink-3)}

.step .drop{position:relative;display:grid;place-items:center;cursor:pointer;
  aspect-ratio:4/3;border:1px dashed var(--line-2);border-radius:10px;
  background:var(--panel-2);overflow:hidden;transition:border-color .15s ease}
.step .drop:hover{border-color:var(--brand)}
.step .drop:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.step .drop.over{border-color:var(--brand);border-style:solid}
.step .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.step .drop img{width:100%;height:100%;object-fit:contain;background:var(--bg)}
.step .drop .empty{display:grid;gap:2px;justify-items:center;text-align:center;padding:14px}
.step .drop .empty b{font-size:13px;font-weight:500}
.step .drop .empty span{font-size:11.5px;color:var(--ink-3)}
.step .drop .swap{position:absolute;right:8px;bottom:8px;padding:5px 10px;
  border-radius:7px;font-size:11.5px;background:rgba(0,0,0,.66);color:#fff;
  pointer-events:none}
.group{display:grid;gap:9px}
.group > .mono{display:flex;align-items:center;gap:8px}
.group > .mono b{color:var(--brand);font-weight:500}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.model{padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--panel-2);text-align:start;transition:150ms var(--ease)}
.model:hover{border-color:var(--line-2);translate:0 -2px}
.model[aria-pressed="true"]{border:2px solid var(--brand)}
.model .ph{aspect-ratio:3/4;position:relative;background:var(--raised)}
.model .ph img{width:100%;height:100%;object-fit:cover}
.model .sample{position:absolute;inset-inline:0;bottom:0;padding:2px;
  background:color-mix(in srgb,var(--bad) 90%,transparent);color:#fff;
  font:500 7.5px/1.4 "Martian Mono",monospace;text-align:center;letter-spacing:.06em}
.model .meta{padding:6px 7px}
.model b{display:block;font-size:11.5px;font-weight:500}
.model span{font-size:10px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;
  border:1px solid var(--line);border-radius:9px}
.seg button{padding:9px 4px;border-radius:6px;color:var(--ink-2);font-size:12.5px;
  transition:150ms var(--ease);min-height:38px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}

.foot{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.gpu{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.gpu i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.gpu[data-s="warm"] i{background:var(--done)}
.gpu[data-s="busy"] i{background:var(--run)}
.go{width:100%;padding:14px;border-radius:10px;background:var(--brand);color:var(--on-brand);
  font-weight:600;font-size:14.5px;transition:150ms var(--ease);min-height:48px}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{background:var(--raised);color:var(--ink-3);cursor:not-allowed}
.need{font-size:12px;color:var(--ink-3);text-align:center;min-height:16px}
.ghost{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line-2);
  color:var(--ink-2);font-size:13px;transition:150ms var(--ease);min-height:42px}
.ghost:hover{color:var(--ink);border-color:var(--brand)}

.toast{position:fixed;inset-inline-end:18px;bottom:18px;z-index:60;max-width:340px;
  padding:12px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--line-2);
  box-shadow:var(--shadow);font-size:13.5px;opacity:0;translate:0 8px;
  transition:180ms var(--ease);pointer-events:none}
.toast[data-on="true"]{opacity:1;translate:0}
.toast[data-bad="true"]{border-color:var(--bad);color:var(--bad)}

@media (max-width:1100px){ :root{--rail:64px;--panel-w:280px} .tool b,.tool small{display:none}
  .tool{justify-content:center} .rail > .mono{display:none} }
@media (max-width:820px){
  body{overflow:auto}
  /* height:100dvh on the shell is right on desktop, where the three panes
     divide one screen and each scrolls itself. On a phone the panes stack and
     the page must be allowed to grow, or the last one in the column -- the
     panel holding the models and the Generate button -- is squeezed to a
     single pixel while its contents spill out of it invisibly. */
  .app{grid-template-rows:56px auto;height:auto;min-height:100dvh}
  .body{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  .tool{width:auto;justify-content:flex-start} .tool b{display:block}
  /* The panel is a fixed-height scroll container on desktop: one flexible row
     for the controls, one for the footer. On a phone the body has no height of
     its own to divide, so that 1fr resolved against zero -- the panel came out
     0.8 px tall and the thirteen models lived in a 32 px window nobody could
     see. Here it simply flows with the page. */
  .panel{border-inline-start:0;border-top:1px solid var(--line);
    grid-template-rows:auto auto}
  .panel-scroll{overflow:visible}
  /* Generate follows the page down, because otherwise it sits below thirteen
     model photographs and the customer has to scroll past all of them to
     press the only button that matters. */
  .foot{position:sticky;bottom:0;background:var(--panel);
    box-shadow:0 -8px 24px rgba(0,0,0,.35)}
  .canvas{grid-template-rows:auto auto auto}
  .slots{grid-template-columns:1fr}
  /* No row to divide on a phone, so the slot is given a shape instead. */
  .slots{grid-template-rows:auto}
  .slot{aspect-ratio:3/4;min-height:0}
  /* Two across rather than three: a third of a 375 px screen is a thumbnail
     nobody can judge a face from. */
  .models{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <span class="logo">lookzi</span>
    <span class="mono" style="color:var(--ink-3)">studio</span>
    <span class="spacer"></span>
    <span class="chip" id="queue-chip" hidden><i></i><span id="queue-text"></span></span>
    <span class="chip" id="credits">—</span>
    <button class="iconbtn" id="theme" aria-label="Switch between light and dark" title="Light or dark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    </button>
  </div>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Tools"><span class="mono">Tools</span></nav>

    <section class="canvas">
      <div class="canvas-head">
        <h1 id="tool-name">Product → Model</h1>
        <p id="tool-blurb"></p>
      </div>

      <div class="slots">
        <div class="slot" id="slot-b">
          <span class="tag mono">Result</span>
          <div class="empty" id="empty-b">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m3 17 5-4 4 3 3-2 6 5"/></svg>
            <b>Nothing yet</b><span>the finished image lands here</span>
          </div>
          <img id="img-b" alt="" hidden>
          <div class="veil" id="veil" hidden>
            <div>
              <div class="num" id="veil-num">14.3s</div>
              <div class="mono" id="veil-state" style="margin-top:8px">queued</div>
              <div class="mono" id="veil-hint" style="margin-top:6px;font-size:11.5px;color:var(--ink-3)"></div>
              <div class="bar-track" style="margin-top:12px"><i id="veil-bar"></i></div>
              <button class="ghost" id="cancel-job" style="margin-top:16px;width:auto;padding:9px 16px">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <div class="strip">
        <span class="mono">Recent</span>
        <div class="strip-scroll" id="strip"><span class="none">nothing yet</span></div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-scroll">
        <!-- Rendered from the tool's own list of inputs. Placing them by hand
             meant the garment lived in the canvas, the photo and the model in
             the panel, and which appeared was decided by three separate rules
             that disagreed: "change the model" hid the canvas entirely and
             looked like the previous tool with its middle missing. -->
        <ol class="steps" id="inputs"></ol>
      </div>

      <div class="foot">
        <div class="gpu" id="gpu" data-s="idle"><i></i><span id="gpu-text">checking…</span></div>
        <button class="go" id="go" disabled>Generate</button>
        <div class="need" id="need"></div>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
"use strict";

var CLIENT = localStorage.getItem("lookzi-client");
if (!CLIENT) {
  CLIENT = "web-" + (crypto.randomUUID ? crypto.randomUUID()
    : Date.now() + Math.random().toString(16).slice(2));
  localStorage.setItem("lookzi-client", CLIENT);
}

var $ = function (id) { return document.getElementById(id); };
var TOOLS = [], MODELS = [], job = null, poll = null, health = null;
var pick = {tool: null, garment_key: null, garment_url: null,
            person_key: null, person_url: null, model_id: null,
            gender: "woman", age: "20s", build: "average", look: "uzbek",
            modest: "false", prompt: ""};

// Stroked SVG on a 24 grid, one shape per tool. Emoji are not icons: they
// render differently on every platform and carry no meaning at 19px.
var ICON = {
  "product-to-model":'<rect x="3" y="4" width="7" height="7" rx="1"/><path d="M17 4v4M15 6h4"/><path d="M7 15v5M14 20v-5a3 3 0 0 1 6 0v5"/>',
  "virtual-try-on":'<path d="M8 4 4 6v5h3v9h10v-9h3V6l-4-2-4 2Z"/>',
  "model-swap":'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="16" r="3"/><path d="M14 6h5v5M10 18H5v-5"/>',
  "packshot":'<path d="M12 3 3 7v10l9 4 9-4V7l-9-4Z"/><path d="m3 7 9 4 9-4M12 11v10"/>',
  "model-creation":'<circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/>',
  "short-video":'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 11 5-3v8l-5-3"/>'
};
function svg(id) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[id] || ICON["packshot"]) + '</svg>';
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"X-Client-Id": CLIENT}, opts.headers || {});
  if (opts.body && typeof opts.body !== "string") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(path, opts).then(function (r) {
    return r.text().then(function (t) {
      var b = t ? JSON.parse(t) : null;
      if (!r.ok) throw new Error((b && b.detail) || r.statusText);
      return b;
    });
  });
}

var toastTimer;
function toast(text, bad) {
  var el = $("toast");
  el.textContent = text;
  el.dataset.bad = bad ? "true" : "false";
  el.dataset.on = "true";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.dataset.on = "false"; }, 3600);
}

// ---- theme ---------------------------------------------------------------
try {
  var saved = localStorage.getItem("lookzi-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}
$("theme").onclick = function () {
  var root = document.documentElement;
  var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("lookzi-theme", next); } catch (e) {}
};

// ---- the tool shapes the workspace ---------------------------------------
// Nothing is hidden behind a step. Every input the current tool uses is on
// screen at once and can be changed at any time -- which is the difference
// between a studio and a form.
function tool() { return TOOLS.find(function (t) { return t.id === pick.tool; }); }

// What each input is, so the panel can be built from the tool's own list
// rather than from rules written per tool. Adding packshot or model creation
// is now a line in service/tools.py and nothing here.
// The prompt is the customer's own words going back into innerHTML. Escaped
// on the way, because a garment description containing a quote would otherwise
// break the panel, and one containing a tag would do worse than that.
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

var INPUT = {
  garment: {label: "Garment", hint: "the item, laid flat", key: "garment_key"},
  person:  {label: "Your photo", hint: "full body, facing the camera", key: "person_key"},
  model:   {label: "Model", hint: "who wears it"},
  look:    {label: "The look", hint: "who this model should be"},
  prompt:  {label: "The shot", hint: "describe the person and the scene"}
};

var PROMPT_EXAMPLES = [
  "a man in his 30s walking among trees in autumn, golden leaves falling around him",
  "a young woman on a Tashkent street in the evening, warm shop lights behind her",
  "a woman in her 40s in a bright airy room, morning light through a window"
];

// The choices a seller has an opinion about. Everything else -- skin, hair,
// the shape of the face -- varies by seed, so asking twice gives two people
// and nobody has to describe a face they have not seen.
var LOOK = [
  {k: "gender", label: "Who",   options: [["woman","Woman"],["man","Man"]]},
  {k: "age",    label: "Age",   options: [["20s","20s"],["30s","30s"],["40s","40s"],["50s","50s"]]},
  {k: "build",  label: "Build", options: [["slim","Slim"],["average","Average"],["fuller","Fuller"]]},
  {k: "look",   label: "From",  options: [["uzbek","Uzbek"],["kazakh","Kazakh"],["tajik","Tajik"],["slavic","Slavic"]]},
  {k: "modest", label: "Dress", options: [["false","Everyday"],["true","Modest"]]}
];

function selectTool(id) {
  var previous = pick.tool;
  pick.tool = id;
  var t = tool();

  // Keep an upload only if the new tool still wants that kind of thing. A
  // garment is a garment whichever tool asks for it, and re-uploading it to
  // switch tools is a chore; a photo the new tool has no use for is state that
  // silently changes what gets generated.
  if (previous !== id) {
    t.needs.indexOf("garment") < 0 && (pick.garment_key = null, pick.garment_url = null);
    t.needs.indexOf("person") < 0 && (pick.person_key = null, pick.person_url = null);
    t.needs.indexOf("model") < 0 && (pick.model_id = null);
  }

  $("tool-name").textContent = t.label;
  $("tool-blurb").textContent = t.blurb;
  [].forEach.call($("rail").querySelectorAll(".tool"), function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.id === id));
  });
  drawInputs();
  refit();
}

function drawInputs() {
  var t = tool();
  if (!t.needs.length) {
    $("inputs").innerHTML = '<li class="step"><p class="nothing">' +
      'Nothing to upload — press Generate.</p></li>';
    return;
  }
  $("inputs").innerHTML = t.needs.map(function (need, i) {
    var spec = INPUT[need];
    if (!spec) return "";
    var done = need === "model" ? !!pick.model_id : !!pick[spec.key];
    var head = '<span class="step-n" aria-hidden="true">' + (i + 1) + '</span>' +
      '<span class="step-h"><b>' + spec.label + '</b><span>' + spec.hint + '</span></span>';
    if (need === "prompt") {
      return '<li class="step" data-need="prompt" data-done="' +
        (!!(pick.prompt || "").trim()) + '">' + head +
        '<textarea id="prompt" rows="4" placeholder="' +
        esc(PROMPT_EXAMPLES[0]) + '">' + esc(pick.prompt || "") + '</textarea>' +
        '<div class="examples">' + PROMPT_EXAMPLES.map(function (e, i) {
          return '<button data-example="' + i + '">' +
            esc(e.length > 44 ? e.slice(0, 44) + "…" : e) + '</button>';
        }).join("") + '</div></li>';
    }
    if (need === "look") {
      return '<li class="step" data-need="look" data-done="true">' + head +
        '<div class="look">' + LOOK.map(function (row) {
          return '<div class="look-row"><span>' + row.label + '</span><div class="seg">' +
            row.options.map(function (o) {
              return '<button data-look="' + row.k + '" data-v="' + o[0] + '" ' +
                'aria-pressed="' + (String(pick[row.k]) === o[0]) + '">' + o[1] + '</button>';
            }).join("") + '</div></div>';
        }).join("") + '</div></li>';
    }
    if (need === "model") {
      var chosen = MODELS.find(function (m) { return m.id === pick.model_id; });
      return '<li class="step" data-need="model" data-done="' + done + '">' + head +
        (chosen ? '<span class="chosen">' + chosen.display_name + '</span>' : "") +
        '<div class="models" id="models"></div></li>';
    }
    var url = pick[need + "_url"];
    return '<li class="step" data-need="' + need + '" data-done="' + done + '">' + head +
      '<label class="drop' + (url ? " has" : "") + '" data-need="' + need + '">' +
        '<input type="file" accept="image/*" data-need="' + need + '">' +
        (url ? '<img src="' + url + '" alt="">' +
               '<span class="swap">Replace</span>'
             : '<span class="empty"><b>Drop a photo</b><span>or click to choose</span></span>') +
      '</label></li>';
  }).join("");
  if (t.needs.indexOf("model") >= 0) drawModels();
}

function drawModels() {
  var box = $("models");
  if (!box) return;
  box.innerHTML = MODELS.map(function (m) {
    return '<button class="model" aria-pressed="' + (m.id === pick.model_id) + '" data-id="' + m.id + '" ' +
      'title="' + m.display_name + ', ' + m.age + '">' +
      '<span class="ph">' + (m.preview ? '<img src="' + m.preview + '" alt="' + m.display_name + '">' : '') +
      (m.hero_is_placeholder ? '<span class="sample">sample</span>' : '') + '</span>' +
      '<span class="meta"><b>' + m.display_name + '</b><span>' + m.age + '</span></span></button>';
  }).join("");
}

// The button says what is still missing rather than sitting dead and silent.
function refit() {
  var t = tool();
  if (!t) return;
  var missing = [];
  t.needs.forEach(function (n) {
    if (n === "garment" && !pick.garment_key) missing.push("a garment photo");
    if (n === "person" && !pick.person_key) missing.push("your photo");
    if (n === "model" && !pick.model_id) missing.push("a model");
    if (n === "prompt" && !(pick.prompt || "").trim()) missing.push("a description");
  });
  $("go").disabled = missing.length > 0 || !!job;
  $("go").textContent = "Generate · " + t.cost + " credit" + (t.cost === 1 ? "" : "s");
  $("need").textContent = missing.length
    ? "Still needs " + missing.join(" and ")
    : (job ? "" : "Nothing is charged until you press Generate");
}

// ---- uploads -------------------------------------------------------------
// Straight to object storage with a signed link, so a 20 MB photo never
// passes through the web tier.
// One set of handlers on the container, because the inputs are redrawn every
// time the tool changes and listeners bound to elements would go with them.
function wireUploads() {
  var box = $("inputs");
  // The prompt is read as it is typed rather than redrawn, because redrawing
  // the panel on every keystroke would take the cursor with it.
  box.addEventListener("input", function (e) {
    if (e.target.id !== "prompt") return;
    pick.prompt = e.target.value;
    var step = e.target.closest(".step");
    if (step) step.dataset.done = String(!!pick.prompt.trim());
    refit();
  });
  box.addEventListener("change", function (e) {
    var input = e.target.closest('input[type=file]');
    if (input && input.files[0]) upload(input.dataset.need, input.files[0]);
  });
  ["dragenter", "dragover"].forEach(function (ev) {
    box.addEventListener(ev, function (e) {
      var d = e.target.closest(".drop"); if (!d) return;
      e.preventDefault(); d.classList.add("over");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    box.addEventListener(ev, function (e) {
      var d = e.target.closest(".drop"); if (!d) return;
      e.preventDefault(); d.classList.remove("over");
    });
  });
  box.addEventListener("drop", function (e) {
    var d = e.target.closest(".drop"); if (!d) return;
    if (e.dataTransfer.files[0]) upload(d.dataset.need, e.dataTransfer.files[0]);
  });
  box.addEventListener("click", function (e) {
    var ex = e.target.closest("[data-example]");
    if (ex) {
      pick.prompt = PROMPT_EXAMPLES[+ex.dataset.example];
      drawInputs(); refit();
      var box = $("prompt"); if (box) { box.focus(); }
      return;
    }
    var look = e.target.closest("[data-look]");
    if (look) {
      pick[look.dataset.look] = look.dataset.v;
      drawInputs(); refit();
      return;
    }
    var b = e.target.closest(".model"); if (!b) return;
    pick.model_id = b.dataset.id;
    drawInputs(); refit();
  });
}

function upload(need, file) {
  var type = file.type || "image/jpeg";
  // Shown from the local file straight away. Waiting for the round trip to
  // object storage before anything appears makes a good connection feel slow
  // and a poor one feel broken.
  pick[need + "_url"] = URL.createObjectURL(file);
  drawInputs();
  api("/uploads", {method: "POST", body: {kind: need, content_type: type}})
    .then(function (u) {
      return fetch(u.url, {method: "PUT", body: file, headers: {"Content-Type": type}})
        .then(function (r) {
          if (!r.ok) throw new Error("upload failed (" + r.status + ")");
          pick[need + "_key"] = u.key;
          drawInputs(); refit();
        });
    })
    .catch(function (e) {
      toast(e.message, true);
      pick[need + "_key"] = null; pick[need + "_url"] = null;
      drawInputs(); refit();
    });
}
wireUploads();

// ---- picking -------------------------------------------------------------
// ---- running -------------------------------------------------------------
$("go").onclick = function () {
  var t = tool();
  $("go").disabled = true;
  api("/jobs", {method: "POST", body: {
    tool: pick.tool,
    // Whatever was uploaded is the garment. For "change the model" that upload
    // is a photograph of a person wearing clothes, and the clothes are the
    // point of it.
    garment_key: pick.garment_key || pick.person_key,
    // When the customer picked one of our models, that model is who wears it.
    // Sending the upload as the person as well made them wear their own
    // photograph, which is what "change the model" did until now.
    person_key: t.needs.indexOf("model") >= 0 ? null : (pick.person_key || null),
    model_id: pick.model_id || null,
    gender: pick.gender, age: pick.age, build: pick.build, look: pick.look,
    modest: pick.modest === "true",
    prompt: pick.prompt || null,
    // A retried request must not become a second job and a second charge.
    idem_key: "web-" + Date.now() + "-" + Math.random().toString(16).slice(2)
  }}).then(function (j) { watch(j.job_id); })
    .catch(function (e) { toast(e.message, true); refit(); });
};

function watch(id) {
  job = id;
  $("img-b").hidden = true; $("empty-b").hidden = true;
  $("veil").hidden = false; $("veil-bar").style.width = "0";
  refit();
  clearInterval(poll);
  var t0 = Date.now();
  poll = setInterval(function () {
    api("/jobs/" + id).then(function (j) {
      var secs = (Date.now() - t0) / 1000;
      $("veil-state").textContent = j.status === "queued"
        ? (j.position ? j.position + " in the queue" : "queued") : j.status;
      $("cancel-job").hidden = j.status !== "queued";
      // Elapsed, not a countdown. It used to count down from 14.3 -- a figure
      // measured once, on a different checkpoint, for a different tool -- so it
      // reached zero and sat there while the job ran on. A number that is
      // sometimes a lie is worse than no number.
      var typical = (tool() || {}).typical_seconds;
      $("veil-num").textContent = secs.toFixed(1) + "s";
      if (typical) {
        $("veil-bar").style.width = Math.min(96, (secs / typical) * 100) + "%";
        $("veil-hint").textContent = secs > typical * 1.4
          ? "longer than usual — normally about " + typical.toFixed(0) + "s"
          : "usually about " + typical.toFixed(0) + "s";
      } else {
        $("veil-bar").style.width = "0";
        $("veil-hint").textContent = "";
      }

      if (j.status === "done") { clearInterval(poll); finish(j); }
      if (j.status === "failed" || j.status === "cancelled") {
        clearInterval(poll); job = null; $("veil").hidden = true; $("empty-b").hidden = false;
        toast(j.status === "failed"
          ? "That one failed — the credit was returned." : "Cancelled.", j.status === "failed");
        refresh(); refit();
      }
    }).catch(function (e) { clearInterval(poll); job = null; $("veil").hidden = true; toast(e.message, true); refit(); });
  }, 1200);
}

function finish(j) {
  job = null;
  $("veil").hidden = true;
  $("img-b").src = j.result_url; $("img-b").hidden = false;
  toast("Done in " + j.seconds + "s");
  refresh(); refit();
}

$("cancel-job").onclick = function () {
  if (!job) return;
  api("/jobs/" + job + "/cancel", {method: "POST"}).then(function (r) {
    clearInterval(poll); job = null;
    $("veil").hidden = true; $("empty-b").hidden = false;
    $("credits").textContent = r.credits + " credits";
    toast("Cancelled, and the credit is back."); refit();
  }).catch(function () {
    toast("Too late — it is already being generated.", true);
  });
};

// ---- state ---------------------------------------------------------------
function refresh() {
  api("/me").then(function (me) {
    $("credits").textContent = me.credits + (me.credits === 1 ? " credit" : " credits");
  }).catch(function () {});
  api("/jobs?limit=20").then(function (rows) {
    var done = rows.filter(function (r) { return r.result_url; });
    $("strip").innerHTML = done.length
      ? done.map(function (r) {
          return '<a href="' + r.result_url + '" target="_blank" rel="noopener" ' +
                 'title="' + r.tool + '"><img src="' + r.result_url + '" alt=""></a>';
        }).join("")
      : '<span class="none">nothing yet</span>';
  }).catch(function () {});
}

function heartbeat() {
  api("/health").then(function (h) {
    health = h;
    var busy = h.running > 0, queued = h.queued > 0;
    $("gpu").dataset.s = busy ? "busy" : (h.workers_seen ? "warm" : "idle");
    $("gpu-text").textContent = busy ? "Worker busy"
      : (h.workers ? (h.workers + " worker" + (h.workers===1?"":"s") + " ready") : "No worker running");
    $("queue-chip").hidden = !(queued || busy);
    $("queue-chip").dataset.s = busy ? "running" : "queued";
    $("queue-text").textContent = (h.queued + h.running) + " in flight";
  }).catch(function () {
    $("gpu").dataset.s = "idle";
    $("gpu-text").textContent = "Cannot reach the service";
  });
}

// ---- boot ----------------------------------------------------------------
Promise.all([api("/tools"), api("/models")])
  .then(function (r) {
    TOOLS = r[0]; MODELS = r[1];
    $("rail").innerHTML = '<span class="mono">Tools</span>' + TOOLS.map(function (t) {
      return '<button class="tool" data-id="' + t.id + '" aria-pressed="false"' +
        (t.ready ? "" : " disabled") + '>' + svg(t.id) + '<b>' + t.label + '</b>' +
        (t.ready ? "" : '<small>soon</small>') + '</button>';
    }).join("");
    $("rail").addEventListener("click", function (e) {
      var b = e.target.closest(".tool");
      if (b && !b.disabled) selectTool(b.dataset.id);
    });
    selectTool((TOOLS.find(function (t) { return t.ready; }) || TOOLS[0]).id);
    refresh(); heartbeat();
    setInterval(heartbeat, 5000);
  })
  .catch(function (e) { toast(e.message, true); });
})();
</script>
</body>
</html>
